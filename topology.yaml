# AI Supply Chain Topology
# Pipeline from raw materials to end applications
# Edit this file to add/remove tickers, refine relationships, or fix errors.
# Run `python -m supply_chain.topology` to validate after editing.

metadata:
  name: "Substrate"
  description: "Pipeline from silicon to chatbot"
  version: 2
  last_updated: "2026-05-20"

# Layers are rendered left-to-right in the pipeline view.
# `order` controls x-position; `parallel_to` lets two layers occupy the same column.
layers:
  - id: raw_materials
    name: "Raw Materials"
    description: "Rare earths, critical minerals, uranium feedstock"
    order: 0
    color: "#8B6F47"

  - id: energy
    name: "Energy Generation"
    description: "Power for datacenters and devices"
    order: 1
    color: "#E8833A"

  - id: storage_batteries
    name: "Storage & Batteries"
    description: "Grid and device-level energy storage"
    order: 1
    parallel_to: energy
    color: "#D85A4A"

  - id: foundries_memory
    name: "Foundries & Memory"
    description: "Chip fabrication and memory manufacturing"
    order: 2
    color: "#4A7FB5"

  - id: chip_design
    name: "Chip Design"
    description: "CPU/GPU/AI accelerator designers"
    order: 3
    color: "#2A5FA0"

  - id: quantum
    name: "Quantum Compute"
    description: "Alternative compute paradigm"
    order: 3
    parallel_to: chip_design
    color: "#7B5FB8"

  - id: photonics
    name: "Photonics & Optical"
    description: "Optical transceivers, modulators, compound-semi substrates for AI datacenter interconnect"
    order: 3
    parallel_to: chip_design
    color: "#0ea5e9"

  - id: datacenter_infra
    name: "Datacenter & Infrastructure"
    description: "Servers, cooling, power distribution, neoclouds"
    order: 4
    color: "#3FA89E"

  - id: applications
    name: "End Applications"
    description: "AVs, robotics, space, drones, hyperscalers"
    order: 5
    color: "#4FB85A"

