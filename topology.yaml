# Edges encode supply chain dependencies (from -> to means "from supplies to").
# Types: foundry_fab, memory_supply, power_supply, materials, components,
#        compute_capacity, software_substrate
edges:
  # Raw Materials -> Energy (uranium fuel cycle)
  - {from: CCJ,  to: OKLO, type: fuel_supply,    note: "Uranium for SMR fuel"}
  - {from: CCJ,  to: XE,   type: fuel_supply}
  - {from: LEU,  to: OKLO, type: enrichment,     note: "HALEU fuel"}
  - {from: LEU,  to: XE,   type: enrichment}
  - {from: UUUU, to: OKLO, type: fuel_supply}

  # Raw Materials -> Storage/Batteries (lithium)
  - {from: LAC,  to: TE,   type: lithium_supply}
  - {from: LAC,  to: ELVA, type: lithium_supply}
  - {from: LAC,  to: FLNC, type: lithium_supply}
  - {from: LAC,  to: TSLA, type: lithium_supply, note: "EV battery feedstock"}

  # Raw Materials -> Applications (rare-earth magnets in motors)
  - {from: MP,   to: TSLA, type: rare_earth_magnets, note: "Permanent magnets for EV motors"}
  - {from: MP,   to: VRT,  type: rare_earth_magnets, note: "Cooling fan motors"}
  - {from: USAR, to: TSLA, type: rare_earth_magnets}
  - {from: USAR, to: AVEX, type: rare_earth_components}
  - {from: USAR, to: ONDS, type: rare_earth_components}
  - {from: USAR, to: UMAC, type: rare_earth_components}

  # Raw Materials -> Foundries (semiconductor inputs)
  - {from: UAMY, to: TSM,  type: doping_materials, note: "Antimony in semiconductor manufacturing"}
  - {from: UAMY, to: INTC, type: doping_materials}
  - {from: CRML, to: TSM,  type: critical_minerals, note: "Speculative — verify specific supply contract"}
  - {from: TMQ,  to: TSM,  type: critical_minerals, note: "Speculative"}

  # Energy -> Datacenter Infrastructure (power to compute)
  - {from: BE,   to: CRWV, type: power_supply,  note: "Bloom fuel cells used for datacenter onsite power"}
  - {from: BE,   to: NBIS, type: power_supply}
  - {from: GEV,  to: CRWV, type: grid_power}
  - {from: GEV,  to: NBIS, type: grid_power}
  - {from: GEV,  to: DELL, type: power_equipment}
  - {from: OKLO, to: CRWV, type: nuclear_power, note: "SMR power for AI datacenters (announced deals)"}
  - {from: OKLO, to: NBIS, type: nuclear_power}
  - {from: VICR, to: DELL, type: power_modules, note: "Power conversion in servers"}
  - {from: VICR, to: NVDA, type: power_modules, note: "GPU power delivery"}
  - {from: FCEL, to: CRWV, type: power_supply}
  - {from: PLUG, to: CRWV, type: power_supply}

  # Storage/Batteries -> Applications & Datacenters
  - {from: TE,   to: TSLA, type: battery_supply}
  - {from: ELVA, to: TSLA, type: battery_supply}
  - {from: FLNC, to: CRWV, type: grid_storage, note: "BESS backup for datacenters"}
  - {from: FLNC, to: NBIS, type: grid_storage}

  # Foundries -> Chip Design (TSMC is fab for fabless designers)
  - {from: TSM,  to: NVDA, type: foundry_fab, note: "Primary fab for NVDA GPUs"}
  - {from: TSM,  to: AMD,  type: foundry_fab}
  - {from: TSM,  to: AMZN, type: foundry_fab, note: "Trainium/Graviton fab"}
  - {from: TSM,  to: TSLA, type: foundry_fab, note: "FSD inference chips"}

  # Memory -> Chip Design + Datacenter
  - {from: MU,   to: NVDA, type: memory_supply,  note: "HBM stacked on AI GPUs"}
  - {from: MU,   to: AMD,  type: memory_supply}
  - {from: MU,   to: DELL, type: memory_supply}
  - {from: MU,   to: CRWV, type: memory_supply}
  - {from: SNDK, to: DELL, type: flash_storage}
  - {from: STX,  to: DELL, type: hdd_storage}
  - {from: STX,  to: CRWV, type: cold_storage}
  - {from: WDC,  to: DELL, type: storage}
  - {from: WDC,  to: CRWV, type: storage}
  - {from: MRAM, to: NVDA, type: emerging_memory, note: "Niche / speculative"}

  # Chip Design -> Datacenter Infrastructure
  - {from: NVDA, to: DELL, type: gpu_supply,    note: "Dell sells NVDA-powered AI servers"}
  - {from: NVDA, to: CRWV, type: gpu_supply,    note: "CoreWeave fleet is overwhelmingly NVDA"}
  - {from: NVDA, to: NBIS, type: gpu_supply}
  - {from: NVDA, to: IREN, type: gpu_supply}
  - {from: NVDA, to: HUT,  type: gpu_supply}
  - {from: AMD,  to: DELL, type: cpu_gpu_supply}
  - {from: AMD,  to: CRWV, type: cpu_gpu_supply}
  - {from: INTC, to: DELL, type: cpu_supply}

  # Datacenter Infrastructure -> Datacenter Infrastructure (within-layer)
  - {from: VRT,  to: CRWV, type: cooling_power, note: "Liquid cooling, UPS, power distribution"}
  - {from: VRT,  to: NBIS, type: cooling_power}
  - {from: VRT,  to: IREN, type: cooling_power}
  - {from: VRT,  to: HUT,  type: cooling_power}
  - {from: VRT,  to: DELL, type: cooling_power}
  - {from: DELL, to: CRWV, type: server_supply}
  - {from: DELL, to: NBIS, type: server_supply}

  # Chips -> Applications (direct edge chips)
  - {from: NVDA, to: TSLA, type: training_compute, note: "TSLA buys NVDA GPUs for AI training"}
  - {from: NVDA, to: AMZN, type: gpu_supply}
  - {from: NVDA, to: AVEX, type: edge_compute,    note: "Drone autonomy compute"}
  - {from: NVDA, to: ONDS, type: edge_compute}
  - {from: NVDA, to: RKLB, type: avionics_compute}

  # Datacenter -> Applications (compute capacity)
  - {from: CRWV, to: AMZN, type: compute_capacity, note: "Overlapping market for AI compute"}

  # Photonics -> Datacenter interconnect
  - {from: LITE, to: CRWV, type: optical_transceiver}
  - {from: LITE, to: NBIS, type: optical_transceiver}
  - {from: LITE, to: DELL, type: optical_components}
  - {from: COHR, to: CRWV, type: optical_transceiver}
  - {from: COHR, to: NBIS, type: optical_transceiver}
  - {from: COHR, to: DELL, type: optical_components}
  - {from: AAOI, to: CRWV, type: datacom_optics}
  - {from: AAOI, to: NBIS, type: datacom_optics}

  # Compound-semi substrates -> photonics + power chips
  - {from: AXTI, to: LITE, type: substrate_supply}
  - {from: AXTI, to: COHR, type: substrate_supply}
  - {from: AXTI, to: NVTS, type: substrate_supply}

  # Storage/Batteries -> Applications
  - {from: AMPX, to: TSLA, type: battery_supply}
  - {from: EOSE, to: CRWV, type: grid_storage, note: "Zinc BESS for datacenter resilience"}

  # Memory + chip support
  - {from: SIMO, to: SNDK, type: controller_supply}
  - {from: SIMO, to: WDC,  type: controller_supply}

  # Chip design additions
  - {from: NVTS, to: VICR, type: power_chip_supply, note: "GaN in power conversion stages"}
  - {from: ARM,  to: NVDA, type: ip_licensing, note: "ARM ISA in Grace CPU"}
  - {from: ARM,  to: AMD,  type: ip_licensing}
  - {from: ARM,  to: AMBQ, type: ip_licensing}
  - {from: WOLF, to: TSLA, type: sic_inverters, note: "SiC in EV powertrains"}

  # Applications additions
  - {from: PLTR, to: AMZN, type: ai_software, note: "AI/data platforms; loose edge"}
  - {from: NVDA, to: PLTR, type: gpu_supply,  note: "PLTR uses GPU compute"}
  - {from: NVDA, to: OSS,  type: edge_compute_chips}
  - {from: SATL, to: PL,   type: peer_overlap, note: "Both Earth observation; loose"}

# Macro signals to overlay on dashboards (not edges, but inputs to layer-health scoring)
macro_signals:
  - id: uranium_spot
    affects: [CCJ, LEU, UUUU, OKLO, XE]
    yfinance_proxy: "URA"  # ETF as proxy
  - id: lithium
    affects: [LAC, TE, ELVA, FLNC]
    yfinance_proxy: "LIT"
  - id: rare_earths
    affects: [MP, USAR, UUUU]
    yfinance_proxy: "REMX"
  - id: semiconductors
    affects: [NVDA, AMD, INTC, TSM, MU]
    yfinance_proxy: "SOXX"
  - id: clean_energy
    affects: [BE, FCEL, PLUG, OKLO, XE]
    yfinance_proxy: "ICLN"
  - id: ten_year_yield
    affects: []
    yfinance_proxy: "^TNX"
  - id: usd_index
    affects: []
    yfinance_proxy: "DX-Y.NYB"
  - id: vix
    affects: []
    yfinance_proxy: "^VIX"
  - id: hyg
    affects: []
    yfinance_proxy: "HYG"
  - id: lqd
    affects: []
    yfinance_proxy: "LQD"

